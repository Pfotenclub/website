apiVersion: v1
kind: ConfigMap
metadata:
  name: pfotenclub-website-config
  namespace: pfotenclub
  labels:
    app.kubernetes.io/name: pfotenclub-website
data:
  HOST: "0.0.0.0"
  PORT: "4321"
  DISCORD_REDIRECT_URI: "https://pfotenclub.eu/api/auth/callback"
  # Falls der Fabaxi-Bot im selben Namespace "pfotenclub" auf Port 8080 läuft:
  # http://fabaxi-bot.pfotenclub.svc.cluster.local:8080
  # Passe die URL an den Service-Namen deines Fabaxi-Bots im Cluster an:
  FABAXI_API_URL: "http://fabaxi-bot:8080"

