# Vorlage für das Kubernetes Secret (wird NICHT automatisch von ArgoCD angewendet,
# damit keine Klartext-Passwörter in Git liegen).
#
# Am einfachsten erstellst du das echte Secret direkt aus deiner lokalen .env Datei:
#   kubectl create namespace pfotenclub --dry-run=client -o yaml | kubectl apply -f -
#   kubectl create secret generic pfotenclub-website-secrets --from-env-file=.env -n pfotenclub
#
# Alternativ kannst du diese Datei kopieren (z.B. nach secret.yaml, nicht committen!),
# die Werte eintragen und mit `kubectl apply -f secret.yaml` anwenden:
apiVersion: v1
kind: Secret
metadata:
  name: pfotenclub-website-secrets
  namespace: pfotenclub
  labels:
    app.kubernetes.io/name: pfotenclub-website
type: Opaque
stringData:
  DISCORD_CLIENT_ID: ""
  DISCORD_CLIENT_SECRET: ""
  DISCORD_GUILD_ID: ""
  DISCORD_BURGERAMT_ROLE_ID: ""
  SESSION_SECRET: ""
  DISCORD_ORDER_WEBHOOK_URL: ""
  DISCORD_ADMIN_USER_ID: ""
  FABAXI_API_URL: "http://fabaxi-bot.pfotenclub.svc.cluster.local:8080"
  FABAXI_API_KEY: ""

